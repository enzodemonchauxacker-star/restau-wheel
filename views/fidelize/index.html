<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fidelize — Faites revenir vos clients</title>
  <meta name="description" content="Fidelize présente Restau Wheel, l'outil qui fait revenir les clients d'un restaurant.">
  <meta name="theme-color" content="#FFF8F1">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap">
  <link rel="stylesheet" href="/vendor/lenis/lenis.css">
  <link rel="stylesheet" href="/css/fidelize.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFF8F1'/%3E%3Crect x='6' y='6' width='20' height='20' rx='6' fill='%23E8FF95'/%3E%3C/svg%3E">
</head>
<body>
  <header class="nav" id="nav">
    <a class="logo" href="/fidelize">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M8 3.2a4.8 4.8 0 1 1-3.2 1.4" stroke-linecap="round"/>
          <path d="M4.6 2.6v2.4h2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Fidelize
    </a>
    <nav class="nav-links" aria-label="Navigation">
      <a href="https://restauwheel.com" rel="noopener noreferrer">Restau Wheel</a>
      <a href="/mentions">Mentions</a>
    </nav>
    <a class="btn btn-dark" href="https://restauwheel.com" rel="noopener noreferrer">Ouvrir Restau Wheel</a>
  </header>

  <main id="fid">
    <section class="hero" id="hero" data-theme="light">
      <div class="hero-stage">
        <p class="badge">
          <span class="badge-ico" aria-hidden="true"></span>
          Pour les restaurants
        </p>
        <h1 class="hero-title">
          <span class="line" data-reveal>Faites Revenir</span>
          <span class="line" data-reveal>Vos Clients</span>
          <span class="line" data-reveal>À Table.</span>
        </h1>
        <a class="btn btn-dark hero-cta" href="https://restauwheel.com" rel="noopener noreferrer">Ouvrir Restau Wheel</a>
        <div class="orbit" id="orbit" aria-hidden="true"></div>
        <div class="phone" aria-hidden="true">
          <div class="phone-frame">
            <div class="island"></div>
            <div class="status">
              <span>9:41</span>
              <span class="status-dots"></span>
            </div>
            <div class="screen">
              <p class="screen-name">Restau Wheel</p>
              <div class="mini-wheel"></div>
              <p class="screen-sub">Le client tourne, puis revient.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="/vendor/lenis/lenis.min.js"></script>
  <script src="/js/solutions.js"></script>
  <script src="/js/fidelize.js"></script>
</body>
</html>
