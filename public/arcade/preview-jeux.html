<div class="wrap">
  <h1>Reikon — version 3D</h1>
  <p class="sub">Quille Three.js vernie · bowling en perspective · palette crème / lime / encre</p>
  <div class="pin-row" aria-hidden="true">
    <div class="pin-slot"><canvas data-pin data-yaw="-22" data-tilt="-8"></canvas></div>
    <div class="pin-slot"><canvas data-pin="hero" data-yaw="8" data-tilt="-4"></canvas></div>
    <div class="pin-slot"><canvas data-pin data-yaw="28" data-tilt="8"></canvas></div>
  </div>
  <div class="grid">
    <div class="card"><article class="card card-steps game-card" id="game-bowl">
            <div class="game-head">
              <h3 data-scramble>Bowling</h3>
              <p class="game-score" id="bowl-score">Vise, puis lance.</p>
            </div>
            <div class="lane alley lane-3d" id="bowl-lane">
              <canvas id="bowl-canvas" width="563" height="258" aria-label="Piste de bowling en perspective"></canvas>
              <div class="pin-hero" aria-hidden="true">
                <canvas data-pin data-yaw="18" data-tilt="-6"></canvas>
              </div>
            </div>
            <button class="btn btn-dark game-btn" type="button" id="bowl-throw">Lancer</button>
          </article></div><div class="card"><article class="card card-people game-card" id="game-laser">
            <div class="game-head">
              <h3 data-scramble>Laser Game</h3>
              <p class="game-score" id="laser-score">Touche les cibles.</p>
            </div>
            <div class="arena" id="laser-arena"></div>
            <button class="btn btn-dark game-btn" type="button" id="laser-start">Jouer</button>
          </article></div><div class="card"><article class="card card-tools game-card" id="game-claw">
            <div class="game-head">
              <h3 data-scramble>La Pince</h3>
              <p class="game-score" id="claw-msg">Attrape le cadeau.</p>
            </div>
            <div class="cab-glass" id="claw-cab">
              <div class="cab-rail" aria-hidden="true"></div>
              <div class="claw-track" id="claw-track">
                <div class="claw" id="claw">
                  <span class="cable"></span>
                  <svg class="claw-mech" viewBox="0 0 120 150" aria-hidden="true">
                    <g class="arm arm-l">
                      <path fill="#3b3b3b" d="M52 46 L46 78 Q40 110 36 128 Q34 138 44 136 Q50 120 54 90 L64 46 Z"/>
                      <path fill="#1e1e1e" d="M36 124 Q32 136 44 134 Q48 128 44 122 Z"/>
                    </g>
                    <g class="arm arm-r">
                      <path fill="#3b3b3b" d="M68 46 L74 78 Q80 110 84 128 Q86 138 76 136 Q70 120 66 90 L56 46 Z"/>
                      <path fill="#1e1e1e" d="M84 124 Q88 136 76 134 Q72 128 76 122 Z"/>
                    </g>
                    <path fill="#2a2a2a" d="M54 64 L60 138 L66 64 Z"/>
                    <path fill="#3b3b3b" d="M60 64 L66 64 L60 138 Z"/>
                    <rect x="38" y="0" width="44" height="16" rx="3" fill="#1e1e1e"/>
                    <rect x="48" y="14" width="24" height="12" rx="2" fill="#3b3b3b"/>
                    <rect x="26" y="34" width="68" height="12" rx="5" fill="#1e1e1e"/>
                    <path fill="#e8ff95" d="M60 40 L48 56 L60 68 L72 56 Z"/>
                    <circle cx="60" cy="54" r="5" fill="#3b3b3b"/>
                  </svg>
                </div>
              </div>
              <div class="prize-row">
                <span class="gift sack-prize" id="claw-gift">
                  <svg viewBox="0 0 80 100" aria-hidden="true"><use href="#sack-glyph"/></svg>
                </span>
              </div>
            </div>
            <button class="btn btn-dark game-btn" type="button" id="claw-go">Attraper</button>
          </article></div><div class="card"><article class="card card-keep game-card" id="game-loot">
            <div class="game-head">
              <h3 data-scramble>Dix Butins</h3>
              <p class="game-score" id="loot-msg">Un cadeau, neuf os.</p>
            </div>
            <div class="loot-grid" id="loot-grid"></div>
            <button class="btn btn-dark game-btn" type="button" id="loot-reset">Mélanger</button>
          </article></div>
