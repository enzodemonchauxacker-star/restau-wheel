<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekone</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap">
  <link rel="stylesheet" href="/arcade/fid/css/fidelize.css?v=qr">
  <style>
    body { background: #fff8f1; }
    .play-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 22px 0;
      font-family: "General Sans", sans-serif;
    }
    .play-bar .mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: #e8ff95; color: #1e1e1e;
      display: grid; place-items: center;
    }
    .play-bar .mark svg { width: 18px; height: 18px; }
    .play-bar strong { font-size: 22px; font-weight: 500; letter-spacing: -0.03em; }
    .play-slot {
      position: relative;
      width: min(1100px, calc(100% - 32px));
      margin: 18px auto 40px;
    }
    .play-wrap { width: 100%; margin: 0; }
    .play-miss { color: #8d8d8d; padding: 24px 0; }
    #stage.is-leaving {
      animation: game-leave 380ms ease forwards;
      pointer-events: none;
    }
    #stage.is-covered { visibility: hidden; }
    @keyframes game-leave {
      to { opacity: 0; transform: scale(0.94); }
    }
    .result {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      align-items: center;
      justify-content: center;
      font-family: "General Sans", sans-serif;
    }
    .result.show { display: flex; }
    .result-card {
      position: relative;
      width: min(440px, calc(100% - 24px));
      text-align: center;
      background: #fff;
      border: 1px solid #e8e2d9;
      border-radius: 28px;
      padding: 36px 28px 28px;
      overflow: hidden;
    }
    .result.win .result-card { background: #e8ff95; border-color: transparent; }
    .result.show .result-card { animation: card-in 560ms cubic-bezier(.16, 1, .3, 1) both; }
    .result-seal {
      width: 84px; height: 84px; margin: 0 auto 14px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: #fff;
      color: #1e1e1e;
      border: 1px solid #e8e2d9;
    }
    .result.win .result-seal { background: #1e1e1e; color: #e8ff95; border-color: transparent; }
    .result.show .result-seal { animation: seal-in 640ms cubic-bezier(.16, 1, .3, 1) both; }
    .result.lose.show .result-seal { animation: seal-drop 620ms ease both; }
    .seal-win, .seal-lose { display: none; width: 36px; height: 36px; }
    .result.win .seal-win, .result.lose .seal-lose { display: block; }
    .result-sparks { position: absolute; left: 50%; top: 78px; width: 0; height: 0; pointer-events: none; }
    .result-sparks i {
      position: absolute; left: 0; top: 0;
      width: 8px; height: 8px; margin: -4px 0 0 -4px;
      border-radius: 99px; background: #1e1e1e; opacity: 0;
    }
    .result.win.show .result-sparks i { animation: spark 760ms ease-out forwards; }
    .result.win.show .result-sparks i:nth-child(even) { border-radius: 2px; background: #fff8f1; animation-delay: 40ms; }
    .result-kicker { color: #5c5c5c; font-size: 14px; }
    .result h2 {
      font-size: 48px; font-weight: 500; letter-spacing: -0.04em;
      margin: 2px 0 8px; color: #1e1e1e;
    }
    .result .result-detail { color: #3b3b3b; font-size: 16px; }
    .result.show .result-kicker,
    .result.show h2,
    .result.show .result-detail,
    .result.show .result-again {
      animation: rise 480ms ease both;
    }
    .result.show h2 { animation-delay: 90ms; }
    .result.show .result-detail { animation-delay: 160ms; }
    .result.show .result-again { animation-delay: 230ms; }
    .result-again {
      margin-top: 18px;
      height: 44px; padding: 0 18px;
      border: 0; border-radius: 999px;
      background: #1e1e1e; color: #fff8f1;
      font: inherit; font-size: 15px; cursor: pointer;
    }
    .result.win .result-again { background: #1e1e1e; }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px) scale(0.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes seal-in {
      0% { opacity: 0; transform: scale(0.35) rotate(-14deg); }
      70% { transform: scale(1.08) rotate(3deg); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes seal-drop {
      0% { opacity: 0; transform: translateY(-18px); }
      65% { opacity: 1; transform: translateY(5px); }
      100% { transform: none; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes spark {
      0% { opacity: 0; transform: scale(0.3); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #stage.is-leaving,
      .result.show .result-card,
      .result.show .result-seal,
      .result.show .result-kicker,
      .result.show h2,
      .result.show .result-detail,
      .result.show .result-again,
      .result.win.show .result-sparks i { animation: none; }
    }
    .gate {
      width: min(560px, calc(100% - 32px));
      margin: 22px auto 48px;
      font-family: "General Sans", sans-serif;
    }
    .gate form {
      background: #fff;
      border: 1px solid #e8e2d9;
      border-radius: 22px;
      padding: 22px 22px 18px;
    }
    .gate h1 {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }
    .gate .lead { color: #5c5c5c; font-size: 15px; margin: 0 0 18px; }
    .gate label { display: block; font-size: 13px; color: #5c5c5c; margin: 12px 0 0; }
    .gate input[type="text"],
    .gate input[type="email"],
    .gate input[type="tel"] {
      display: block;
      width: 100%;
      margin-top: 6px;
      border: 1px solid #e8e2d9;
      background: #fff8f1;
      border-radius: 12px;
      padding: 12px 12px;
      font: inherit;
      font-size: 16px;
      color: #1e1e1e;
    }
    .gate input:focus { outline: 2px solid #e8ff95; border-color: transparent; }
    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 16px;
      color: #1e1e1e;
      font-size: 14px;
      line-height: 1.4;
    }
    .consent input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
    .gate .fine { color: #8d8d8d; font-size: 13px; margin: 10px 0 0; }
    .gate .error { color: #c43648; font-size: 14px; min-height: 1.2em; margin: 10px 0 0; }
    .gate button {
      margin-top: 8px;
      height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: #1e1e1e;
      color: #fff8f1;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    .gate button:disabled { opacity: 0.55; cursor: default; }
    #stage[hidden], .gate[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="play-bar">
    <a class="mark" href="/arcade/" aria-label="Rekone">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.15c1.35 0 2.28 1.12 2.28 2.4 0 .98-.54 1.52-.84 2.2-.28.68-.2 1.12.04 1.86.38 1.12 1.32 1.86 1.66 3.08.42 1.66-.24 3.08-1.12 3.48H5.98c-.88-.4-1.54-1.82-1.12-3.48.34-1.22 1.28-1.96 1.66-3.08.24-.74.32-1.18.04-1.86-.3-.68-.84-1.22-.84-2.2 0-1.28.93-2.4 2.28-2.4z"/></svg>
    </a>
    <strong id="play-title">Rekone</strong>
  </header>
  <section class="gate" id="gate">
    <form id="gate-form">
      <h1>Avant de jouer</h1>
      <p class="lead">Indiquez vos coordonnées. La salle les utilise pour votre partie et vos lots.</p>
      <label>Prénom
        <input name="first" type="text" autocomplete="given-name" required maxlength="60">
      </label>
      <label>Nom
        <input name="last" type="text" autocomplete="family-name" required maxlength="60">
      </label>
      <label>E-mail
        <input name="email" type="email" autocomplete="email" required maxlength="120">
      </label>
      <label>Téléphone
        <input name="phone" type="tel" autocomplete="tel" required maxlength="24">
      </label>
      <label class="consent">
        <input id="privacy_consent" name="consent" type="checkbox" required>
        <span>J’accepte que la salle utilise mon nom, mon prénom, mon e-mail et mon téléphone pour le suivi de ma partie et de mes lots, conformément au RGPD.</span>
      </label>
      <p class="fine">Vous pouvez demander l’accès ou la suppression de ces données auprès de la salle.</p>
      <p class="error" id="gate-error" role="alert"></p>
      <button type="submit" id="gate-go">Commencer la partie</button>
    </form>
  </section>
  <div class="play-slot" id="play-slot">
    <main class="play-wrap" id="stage" hidden><p class="play-miss" id="play-status">Chargement du jeu…</p></main>
    <section class="result" id="result" aria-live="polite">
      <div class="result-card">
        <div class="result-sparks" aria-hidden="true">
          <i style="--x:-72px;--y:-28px"></i>
          <i style="--x:76px;--y:-24px"></i>
          <i style="--x:-96px;--y:18px"></i>
          <i style="--x:98px;--y:14px"></i>
          <i style="--x:-34px;--y:-58px"></i>
          <i style="--x:38px;--y:-62px"></i>
          <i style="--x:-16px;--y:34px"></i>
          <i style="--x:18px;--y:38px"></i>
        </div>
        <div class="result-seal" aria-hidden="true">
          <svg class="seal-win" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.2 17 19 7"/></svg>
          <svg class="seal-lose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </div>
        <p class="result-kicker" id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p class="result-detail" id="result-detail"></p>
        <button class="result-again" id="result-again" type="button">Rejouer</button>
      </div>
    </section>
  </div>
  <script>
    const GAMES = {
      bowling: ['game-bowl', 'Bowling'],
      laser: ['game-laser', 'Laser game'],
      pince: ['game-claw', 'La pince'],
      butin: ['game-loot', 'Dix butins'],
    };
    const params = new URLSearchParams(location.search);
    const key = params.get('jeu');
    const picked = GAMES[key] || GAMES.bowling;
    const gameId = GAMES[key] ? key : 'bowling';
    document.getElementById('play-title').textContent = picked[1];
    document.title = 'Rekone — ' + picked[1];

    function readLots() {
      const raw = params.get('lots');
      if (!raw) return [];
      try {
        const pad = (4 - (raw.length % 4)) % 4;
        const padded = raw.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat(pad);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const slim = JSON.parse(new TextDecoder().decode(bytes));
        return slim.map((lot) => ({ name: lot[0], percent: Number(lot[1]) || 0, win: !!lot[2], days: lot[3] }));
      } catch (error) {
        return [];
      }
    }

    const lots = readLots();

    function drawLot() {
      const roll = Math.random() * 100;
      let cursor = 0;
      for (const lot of lots) {
        cursor += lot.percent;
        if (roll < cursor) return lot;
      }
      return null;
    }

    let identity = null;
    let playerId = '';
    let settled = false;
    let gameReady = false;

    function outcome() {
      const lot = lots.length ? drawLot() : null;
      const won = !!(lot && lot.win);
      if (!lots.length) {
        return { won: false, kicker: 'Résultat', title: 'Aucun lot', detail: 'Ce jeu n’a pas encore de lots à gagner.', prize: 'Aucun lot', record: false };
      }
      return {
        won,
        kicker: won ? 'Votre lot' : 'Cette fois',
        title: won ? 'Gagné' : 'Perdu',
        detail: won ? lot.name + ' · à utiliser sous ' + lot.days + ' jours.' : 'Pas de lot. Retentez une partie.',
        prize: won ? lot.name : 'Pas de lot cette fois',
        record: true,
      };
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let revealTimer = 0;

    function hideResult() {
      window.clearTimeout(revealTimer);
      const stage = document.getElementById('stage');
      const box = document.getElementById('result');
      stage.classList.remove('is-leaving', 'is-covered');
      box.classList.remove('show', 'win', 'lose');
    }

    function showResult(result) {
      const stage = document.getElementById('stage');
      const box = document.getElementById('result');
      window.clearTimeout(revealTimer);
      box.classList.remove('show', 'win', 'lose');
      stage.classList.remove('is-covered');
      stage.classList.add('is-leaving');
      const wait = reduceMotion ? 0 : 380;
      revealTimer = window.setTimeout(() => {
        stage.classList.add('is-covered');
        box.classList.add('show', result.won ? 'win' : 'lose');
        document.getElementById('result-kicker').textContent = result.kicker;
        document.getElementById('result-title').textContent = result.title;
        document.getElementById('result-detail').textContent = result.detail;
      }, wait);
    }

    async function remember(result) {
      if (!identity || !result.record) return;
      const payload = { prize: result.prize, win: result.won };
      if (!settled && playerId) {
        settled = true;
        await fetch('/arcade/api/joueurs/' + encodeURIComponent(playerId), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        return;
      }
      const response = await fetch('/arcade/api/joueurs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...identity, game: gameId, consent: true, ...payload }),
      });
      if (response.ok) {
        const data = await response.json();
        playerId = data.player.id;
        settled = true;
      }
    }

    window.addEventListener('arcade-round', (event) => {
      if (!event.detail || event.detail.phase === 'start') {
        hideResult();
        settled = false;
        return;
      }
      const result = outcome();
      showResult(result);
      remember(result);
    });

    document.getElementById('result-again').addEventListener('click', () => {
      hideResult();
      const replay = document.querySelector('#bowl-throw[data-mode="reset"], #claw-go[data-mode="reset"], #loot-reset, #laser-start');
      if (replay && !replay.disabled) replay.click();
    });

    function openGame() {
      document.getElementById('gate').hidden = true;
      const stage = document.getElementById('stage');
      stage.hidden = false;
      if (gameReady) return;
      gameReady = true;
      fetch('/arcade/index.html')
        .then((response) => response.text())
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const defs = doc.querySelector('svg.ios-defs');
          const article = doc.getElementById(picked[0]);
          const status = document.getElementById('play-status');
          if (!article) {
            status.textContent = 'Ce jeu est introuvable.';
            return;
          }
          status.remove();
          if (defs) stage.append(defs);
          stage.append(article);
          const script = document.createElement('script');
          script.src = '/arcade/fid/js/games.js?v=result';
          document.body.append(script);
        })
        .catch(() => {
          document.getElementById('play-status').textContent = 'Le jeu ne s’est pas ouvert.';
        });
    }

    document.getElementById('gate-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.getElementById('gate-error');
      const button = document.getElementById('gate-go');
      if (!form.consent.checked) {
        error.textContent = 'Cochez la case pour accepter l’utilisation de vos données.';
        return;
      }
      identity = {
        first: form.first.value.trim(),
        last: form.last.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
      };
      error.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/arcade/api/joueurs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...identity, game: gameId, consent: true }),
        });
        if (!response.ok) throw new Error('save');
        const data = await response.json();
        playerId = data.player.id;
        openGame();
      } catch (saveError) {
        error.textContent = 'L’enregistrement n’a pas abouti. Réessayez.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
