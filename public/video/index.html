<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Restau Wheel – Pub 3D</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:#fff8e7;font-family:system-ui;padding:1.5rem}
.wrap{max-width:380px;width:100%;text-align:center}
.badge{display:inline-block;background:#ff2d55;color:#fff;font-weight:800;border-radius:999px;padding:.45rem .9rem;margin-bottom:.8rem;text-transform:uppercase;font-size:.8rem}
h1{color:#ffd60a;font-size:1.4rem;margin:0 0 .5rem}
p{color:#a0a0b0;margin:0 0 1rem;line-height:1.45}
.video-wrap{border-radius:20px;overflow:hidden;box-shadow:0 0 0 2px #ffd60a,0 10px 40px rgba(0,0,0,.8);background:#000}
video{width:100%;display:block;aspect-ratio:9/16;background:#000}
.links{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
a{display:inline-block;padding:.8rem 1.2rem;border-radius:999px;background:#ffd60a;color:#0a0a0a;font-weight:700;text-decoration:none}
a.sec{background:#1c1c24;color:#fff8e7;border:1px solid #333}
.err{color:#ff8a8a;font-size:.85rem;margin-top:.8rem;display:none}
.status{color:#7dd3a7;font-size:.8rem;margin-top:.6rem;min-height:1.2em}
</style></head><body><div class="wrap">
<div class="badge">v16 • lite 720p</div>
<h1>Restau Wheel</h1>
<p>4 plans 3D + texte + SFX. Version ultra-légère (~4 Mo) pour mobile / Cursor.</p>
<div class="video-wrap">
<video id="v" controls playsinline webkit-playsinline preload="auto" muted>
  Your browser does not support MP4.
</video>
</div>
<p class="status" id="status">Chargement…</p>
<p class="err" id="err">Échec de lecture. Utilise « Ouvrir CDN » ou « Télécharger ».</p>
<div class="links">
<a id="dl" download="restau_wheel_promo_v15.mp4">Télécharger</a>
<a class="sec" id="cdn" target="_blank" rel="noopener">Ouvrir CDN</a>
</div>
<script>
const CDN_SHA = '272387082772a480021f5f91630d1169d235d7a9';
const cdn = 'https://cdn.jsdelivr.net/gh/enzodemonchauxacker-star/restau-wheel@' + CDN_SHA + '/public/video/restau_wheel_promo_v15.mp4';
const local = '/video/restau_wheel_promo_v15.mp4?v=16';
// CDN first (correct video/mp4 MIME), then local
const sources = CDN_SHA === '272387082772a480021f5f91630d1169d235d7a9' ? [local] : [cdn, local];

const v = document.getElementById('v');
const dl = document.getElementById('dl');
const cdnA = document.getElementById('cdn');
const err = document.getElementById('err');
const status = document.getElementById('status');

cdnA.href = CDN_SHA === '272387082772a480021f5f91630d1169d235d7a9' ? local : cdn;
dl.href = sources[0];
let i = 0;

function load(idx) {
  if (idx >= sources.length) {
    status.textContent = '';
    err.style.display = 'block';
    return;
  }
  status.textContent = sources[idx].includes('jsdelivr') ? 'Chargement CDN…' : 'Chargement local…';
  v.src = sources[idx];
  dl.href = sources[idx];
  v.load();
}

v.addEventListener('error', () => { i += 1; load(i); });
v.addEventListener('loadeddata', () => {
  status.textContent = 'Prêt — appuie sur Lecture';
  err.style.display = 'none';
});
v.addEventListener('play', () => { v.muted = false; }, { once: true });

load(0);
</script>
</div></body></html>
