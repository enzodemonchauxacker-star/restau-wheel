<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Restau Wheel – Vidéo Promo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0a0a0f; color:#fff8e7; font-family:system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .container { max-width:480px; width:100%; text-align:center; }
    .badge { display:inline-block; margin-bottom:.85rem; padding:.45rem .9rem; border-radius:999px; background:#ff2d55; color:#fff; font-size:.8rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
    h1 { font-size:1.5rem; margin-bottom:.5rem; color:#ffd60a; }
    p { color:#a0a0b0; font-size:.95rem; margin-bottom:1.25rem; }
    .video-wrap { max-width:380px; margin:0 auto 1.5rem; border-radius:20px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.8),0 0 0 2px #ffd60a; background:#000; }
    video { width:100%; display:block; aspect-ratio:9/16; }
    a.btn { display:inline-block; padding:.8rem 1.4rem; border-radius:999px; text-decoration:none; font-weight:700; background:#ffd60a; color:#0a0a0a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">v5 • SFX only • no VO • no music</div>
    <h1>Restau Wheel — Motion Video</h1>
    <p>Typewriter + whoosh / ticks / impacts uniquement. Pas de voix, pas de musique.</p>
    <div class="video-wrap">
      <video id="promo" controls playsinline preload="auto"></video>
    </div>
    <a class="btn" id="dl" download="restau_wheel_promo.mp4">Télécharger le MP4</a>
  </div>
  <script>
    const local = '/video/restau_wheel_promo_sfx_only.mp4';
    const cdn = 'https://cdn.jsdelivr.net/gh/enzodemonchauxacker-star/restau-wheel@abee0db5f190a91a96af3c381d6550ebb5dd8787/public/video/restau_wheel_promo_sfx_only.mp4';
    const v = document.getElementById('promo');
    const dl = document.getElementById('dl');
    v.src = local; dl.href = local;
    v.addEventListener('error', () => { v.src = cdn; dl.href = cdn; });
  </script>
</body>
</html>
