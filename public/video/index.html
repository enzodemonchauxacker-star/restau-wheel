<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restau Wheel – Vidéo Promo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #fff8e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #ffd60a;
    }
    p {
      color: #a0a0b0;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin: 0 auto 1.5rem;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 2px #ffd60a;
      background: #000;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 9/16;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-block;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.15s ease;
    }
    a.btn-primary {
      background: #ffd60a;
      color: #0a0a0a;
    }
    a.btn-secondary {
      background: #1a1a24;
      color: #fff8e7;
      border: 1px solid #333345;
    }
    a.btn:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Restau Wheel — Motion Video</h1>
    <p>Format 9:16 • Texte machine à écrire • 3D • VO FR • 20s</p>
    
    <div class="video-wrap">
      <video controls playsinline preload="auto" src="/video/restau_wheel_promo_typewriter.mp4"></video>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="/video/restau_wheel_promo_typewriter.mp4" download="restau_wheel_promo.mp4">Télécharger le MP4</a>
      <a class="btn btn-secondary" href="/">← Retour au site</a>
    </div>
  </div>
</body>
</html>
