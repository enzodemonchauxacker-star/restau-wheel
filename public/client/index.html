<!DOCTYPE html>
<html lang="fr" data-i18n-title="client.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tentez votre chance !</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --accent: #ffd60a;
      --accent-dark: #e6c000;
      --accent-glow: rgba(255,214,10,0.55);
      --accent-soft: rgba(255,45,106,0.12);
    }
    body {
      min-height: 100vh;
      background: var(--felt);
      color: var(--ivory);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3.2rem 1rem 1.75rem;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(255,214,10,0.14), transparent 55%),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.025) 3px, rgba(0,0,0,0.025) 4px);
      pointer-events: none;
      z-index: 0;
    }
    .page { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

    .header { text-align: center; margin-bottom: 1.5rem; animation: fadeUp .5s var(--ease) both; }
    .header .mono {
      display: block;
      color: var(--brass);
      font-size: 0.7rem;
      margin-bottom: 0.75rem;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 7vw, 2.4rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--ivory);
      margin-bottom: 0.4rem;
    }
    .header p { color: rgba(255,248,231,0.55); font-size: 0.9rem; }

    #form-section {
      width: 100%;
      background: var(--ivory);
      color: var(--ink);
      padding: 1.75rem 1.4rem 1.5rem;
      position: relative;
      animation: fadeUp .55s var(--ease) .08s both;
    }
    #form-section::before,
    #form-section::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 10px;
      background: radial-gradient(circle at 8px 0, transparent 7px, var(--ivory) 8px) repeat-x;
      background-size: 16px 10px;
    }
    #form-section::before { top: -10px; transform: scaleY(-1); }
    #form-section::after { bottom: -10px; }
    .ticket-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }
    .field label { color: var(--muted); }
    .field input {
      background: var(--ticket);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: var(--radius);
    }
    .field input:focus {
      border-color: var(--brass);
      background: #f7f1e6;
      box-shadow: none;
    }
    .field input::placeholder { color: rgba(107,99,88,0.5); }
    .err { color: var(--wine); text-align: left; }
    .btn-gold {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.35rem;
      background: var(--wine);
      border: none;
      border-radius: var(--radius);
      color: var(--ivory);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s var(--ease), background .2s;
    }
    .btn-gold:hover { transform: translateY(-1px); background: #ff4d85; }
    .btn-gold:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    #wheel-section {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 460px;
      animation: fadeUp .4s var(--ease);
    }
    .wheel-hint { font-size: 0.88rem; color: rgba(255,248,231,0.55); margin-bottom: 1rem; text-align: center; }
    .wheel-wrap {
      position: relative;
      width: min(360px, 90vw);
      height: min(360px, 90vw);
    }
    .wheel-wrap::before {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,214,10,0.18) 0%, transparent 70%);
      pointer-events: none;
      animation: feltPulse 3s ease-in-out infinite;
    }
    #wheel-canvas { width: 100%; height: 100%; display: block; }
    .pointer {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pointer-dot {
      width: 10px; height: 10px;
      background: var(--ivory);
      border-radius: 50%;
      margin-bottom: -2px;
      z-index: 1;
      box-shadow: 0 0 0 2px var(--ink);
    }
    .pointer-tri {
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid var(--wine);
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
    }
    .btn-spin {
      margin-top: 1.4rem;
      padding: 0.95rem 2.5rem;
      background: var(--wine);
      border: none;
      border-radius: var(--radius);
      color: var(--ivory);
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform .2s var(--ease), background .2s;
    }
    .btn-spin:hover { transform: translateY(-2px); background: #ff4d85; }
    .btn-spin:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    #result-section {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 400px;
      animation: fadeUp .5s var(--ease);
    }
    .result-icon { font-size: 2.5rem; margin-bottom: 0.75rem; filter: grayscale(0.2); }
    .result-card {
      width: 100%;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 1.75rem 1.4rem;
      position: relative;
    }
    .result-card.won {
      box-shadow: 8px 12px 0 rgba(0,0,0,0.25);
    }
    .result-prize {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--wine);
      margin-bottom: 0.5rem;
    }
    .result-prize.no-win {
      color: var(--muted);
      font-size: 1.3rem;
    }
    .result-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 1rem; line-height: 1.5; }
    .result-deadline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--brass);
      color: var(--brass);
      background: transparent;
      padding: 0.5rem 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }
    .result-next-visit {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--font-mono);
      margin-bottom: 0.6rem;
    }
    .result-name {
      color: var(--green);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .reminder-opt {
      margin-top: 1.1rem;
      padding: 0.9rem 1rem;
      background: var(--ticket);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color .2s;
    }
    .reminder-opt:hover { border-color: var(--brass); }
    .reminder-opt input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--wine);
      flex-shrink: 0;
    }
    .reminder-opt-label { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .reminder-opt-label strong { color: var(--ink); }
    .reminder-confirm { color: var(--green); font-size: 0.82rem; margin-top: 0.5rem; display: none; }

    #sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
    .spark { position: absolute; border-radius: 50%; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>
<div class="lang-float lang-switch" role="group" aria-label="Language">
  <button type="button" data-lang-btn="fr">FR</button>
  <button type="button" data-lang-btn="en">EN</button>
</div>
<div class="page" id="client-app">

<div class="header">
  <span class="mono" data-i18n="client.kicker">TIREZ VOTRE CHANCE</span>
  <h1 data-i18n="client.h1">La roue vous attend.</h1>
  <p data-i18n="client.sub">Remplissez le ticket, puis tournez</p>
</div>

<div id="form-section">
  <div class="ticket-label" data-i18n="client.ticket">BON DE PARTICIPATION</div>
  <div class="field">
    <label data-i18n="client.first">Prénom</label>
    <input type="text" id="first_name" data-i18n-placeholder="client.ph.first" placeholder="Votre prénom" autocomplete="given-name">
  </div>
  <div class="field">
    <label data-i18n="client.last">Nom</label>
    <input type="text" id="last_name" data-i18n-placeholder="client.ph.last" placeholder="Votre nom de famille" autocomplete="family-name">
  </div>
  <div class="field">
    <label data-i18n="client.email">Email</label>
    <input type="email" id="email" data-i18n-placeholder="client.ph.email" placeholder="votre@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label data-i18n="client.phone">Téléphone</label>
    <input type="tel" id="phone" data-i18n-placeholder="client.ph.phone" placeholder="06 12 34 56 78" autocomplete="tel" inputmode="tel">
  </div>
  <p class="err" id="form-err">Veuillez remplir tous les champs correctement.</p>
  <button class="btn-gold" id="btn-next" data-i18n="client.next">Accéder à la roue →</button>
</div>

<div id="wheel-section">
  <p class="wheel-hint" data-i18n="client.wheel.hint">Appuyez pour faire tourner la roue</p>
  <div class="wheel-wrap">
    <div class="pointer">
      <div class="pointer-dot"></div>
      <div class="pointer-tri"></div>
    </div>
    <canvas id="wheel-canvas" width="600" height="600"></canvas>
  </div>
  <button class="btn-spin" id="btn-spin" data-i18n="client.wheel.spin">Tourner la roue</button>
</div>

<div id="result-section">
  <div id="result-icon" class="result-icon"></div>
  <div id="result-card" class="result-card">
    <div id="result-prize" class="result-prize"></div>
    <div id="result-desc"  class="result-desc"></div>
    <div id="result-next-visit" class="result-next-visit" style="display:none" data-i18n="client.result.next">
      À présenter lors de votre prochaine visite
    </div>
    <div id="result-deadline" class="result-deadline" style="display:none">
      <span id="deadline-text"></span>
    </div>
    <div id="result-name" class="result-name"></div>
    <label class="reminder-opt" id="reminder-opt" style="display:none">
      <input type="checkbox" id="reminder-check" onchange="toggleReminder(this)">
      <div class="reminder-opt-label">
        <strong data-i18n="client.sms.title">Me rappeler par SMS</strong><br>
        <span data-i18n="client.sms.desc">Relance automatique avant expiration de ton gain (ex. J-7)</span>
      </div>
    </label>
    <div class="reminder-confirm" id="reminder-confirm">✓ Rappels activés !</div>
  </div>
</div>

</div>
<div id="sparkles"></div>

<script src="/js/i18n.js"></script>
<script>
const tr = (k, v) => window.RW_I18N.t(k, v);
const loc = () => window.RW_I18N.locale();

// ─── Constantes canvas ────────────────────────────────────────────────────────
const PI2      = Math.PI * 2;
const CX = 300, CY = 300;
const OUTER_R  = 282;   // bord extérieur anneau doré
const RING_W   = 22;    // largeur anneau
const SEG_R    = OUTER_R - RING_W;   // 260 — bord externe des segments
const CENTER_R = 36;                  // rayon du bouton central

// ─── Couleurs ─────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}
// Accepte un objet {r,g,b} ou une string '#rrggbb'
function adjustRgb(src, amt) {
  const c = typeof src === 'string' ? hexToRgb(src) : src;
  const cl = v => Math.max(0, Math.min(255, v + amt));
  return { r: cl(c.r), g: cl(c.g), b: cl(c.b) };
}
function rgbStr({ r, g, b }) { return `rgb(${r},${g},${b})`; }

function darkenAccent(hex, ratio) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.round(r*ratio)},${Math.round(g*ratio)},${Math.round(b*ratio)})`;
}
function lightenAccent(hex, ratio) {
  const { r, g, b } = hexToRgb(hex);
  const blend = v => Math.round(v + (255 - v) * ratio);
  return `rgb(${blend(r)},${blend(g)},${blend(b)})`;
}

async function applyTheme() {
  try {
    const theme = await fetch(`/api/theme?r=${RESTAURANT_ID}`).then(r => r.json());
    if (theme.theme_accent) {
      const hex   = theme.theme_accent;
      const { r, g, b } = hexToRgb(hex);
      const dark  = `rgb(${Math.round(r*.75)},${Math.round(g*.75)},${Math.round(b*.75)})`;
      const soft  = `rgba(${r},${g},${b},0.1)`;
      const glow  = `rgba(${r},${g},${b},0.7)`;
      document.documentElement.style.setProperty('--accent',      hex);
      document.documentElement.style.setProperty('--accent-dark', dark);
      document.documentElement.style.setProperty('--accent-soft', soft);
      document.documentElement.style.setProperty('--accent-glow', glow);
    }
  } catch(e) { /* garde les valeurs par défaut */ }
}

function shortLabel(name) {
  const n = name.toLowerCase();
  if (n.includes('rien') || n.includes('nothing') || n === 'none') return tr('client.wheel.none');
  if (n.includes('%'))       return '-10%';
  if (n.includes('dessert')) return tr('client.wheel.dessert');
  if (n.includes('boisson') || n.includes('verre') || n.includes('drink')) return tr('client.wheel.drink');
  if (n.includes('café') || n.includes('cafe') || n.includes('coffee')) return tr('client.wheel.coffee');
  return name.substring(0, 8);
}

// ─── Identifiant restaurant (param ?r=) ──────────────────────────────────────
const RESTAURANT_ID = new URLSearchParams(window.location.search).get('r');
if (!RESTAURANT_ID) {
  document.getElementById('client-app').innerHTML = `
    <div style="text-align:center;padding:20px">
      <p class="mono" data-i18n="client.err.tag" style="color:var(--brass);margin-bottom:12px">ERREUR</p>
      <h2 data-i18n="client.err.invalid" style="font-family:var(--font-display);margin-bottom:8px;">Lien invalide</h2>
      <p data-i18n="client.err.invalid.p" style="color:rgba(255,248,231,.55)">Scannez le QR code de votre restaurant.</p>
    </div>`;
  window.RW_I18N.applyI18n();
}

// ─── State ────────────────────────────────────────────────────────────────────
let prizes   = [];
let slots    = [];
let formData = {};
let angle    = 0;
let spinning = false;

// ─── Chargement lots → 12 slots ──────────────────────────────────────────────
async function loadPrizes() {
  const res = await fetch(`/api/prizes?r=${RESTAURANT_ID}`);
  prizes = await res.json();
  slots  = [];
  prizes.forEach(p => {
    const baseRgb = hexToRgb(p.color);
    for (let i = 0; i < p.probability; i++) {
      slots.push({
        id:         p.id,
        name:       p.name,
        is_real:    p.deadline_days > 0,
        baseRgb,
        offset:     0,
        shortLabel: shortLabel(p.name),
      });
    }
  });
  // Mélange Fisher-Yates
  for (let i = slots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [slots[i], slots[j]] = [slots[j], slots[i]];
  }
  // Alternance claire/sombre par lot pour distinguer les segments adjacents identiques
  const seen = {};
  slots.forEach(s => {
    seen[s.id] = (seen[s.id] || 0) + 1;
    s.offset = seen[s.id] % 2 === 0 ? -28 : 0;
  });
}

// ─── Dessin de la roue ────────────────────────────────────────────────────────
function drawWheel(currentAngle, flashSlot = -1) {
  const canvas = document.getElementById('wheel-canvas');
  const ctx    = canvas.getContext('2d');
  ctx.clearRect(0, 0, 600, 600);

  const segCount = slots.length || 12;
  const segAngle = PI2 / segCount;

  // ── 1. Ombre externe ─────────────────────────────────────────────────────────
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur  = 45;
  ctx.beginPath();
  ctx.arc(CX, CY, OUTER_R + 4, 0, PI2);
  ctx.fillStyle = 'rgba(0,0,0,0.01)'; // invisible fill juste pour l'ombre
  ctx.fill();
  ctx.restore();

  // ── 2. Segments (rotatifs) ────────────────────────────────────────────────────
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(currentAngle);

  slots.forEach((slot, i) => {
    const sa  = i * segAngle;
    const ea  = sa + segAngle;
    const mid = sa + segAngle / 2;

    const isFlash  = (i === flashSlot);
    const baseRgb  = isFlash ? { r:255, g:255, b:180 } : adjustRgb(slot.baseRgb, slot.offset);
    const innerRgb = isFlash ? { r:255, g:255, b:255 } : adjustRgb(slot.baseRgb, slot.offset + 55);
    const outerRgb = adjustRgb(slot.baseRgb, slot.offset - 25);

    // Gradient radial du centre vers le bord
    const grad = ctx.createRadialGradient(0, 0, CENTER_R, 0, 0, SEG_R);
    grad.addColorStop(0,    rgbStr(innerRgb));
    grad.addColorStop(0.45, rgbStr(baseRgb));
    grad.addColorStop(1,    rgbStr(outerRgb));

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, SEG_R, sa, ea);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Bordure segment
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    // Texte radial (tête en haut vers le bord)
    ctx.save();
    ctx.rotate(mid);
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = 'rgba(255,255,255,0.95)';
    ctx.shadowColor  = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur   = 5;
    const fs = slot.shortLabel === tr('client.wheel.none') ? 16 : 14;
    ctx.font = `bold ${fs}px Outfit, sans-serif`;
    ctx.fillText(slot.shortLabel, SEG_R * 0.63, 0);
    ctx.restore();
  });

  // Séparateurs entre segments
  for (let i = 0; i < segCount; i++) {
    const a = i * segAngle;
    ctx.beginPath();
    ctx.moveTo(CENTER_R * Math.cos(a), CENTER_R * Math.sin(a));
    ctx.lineTo(SEG_R    * Math.cos(a), SEG_R    * Math.sin(a));
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth   = 2;
    ctx.stroke();
  }

  ctx.restore(); // fin rotation

  // ── 3. Anneau extérieur (couleur thème, fixe) ────────────────────────────────
  const accentHex  = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#FFD700';
  const accentDark = darkenAccent(accentHex, 0.45);
  const accentLight = lightenAccent(accentHex, 0.6);
  const goldGrad = ctx.createLinearGradient(CX - OUTER_R, CY, CX + OUTER_R, CY);
  goldGrad.addColorStop(0,    accentDark);
  goldGrad.addColorStop(0.18, accentHex);
  goldGrad.addColorStop(0.38, accentLight);
  goldGrad.addColorStop(0.5,  accentHex);
  goldGrad.addColorStop(0.62, accentLight);
  goldGrad.addColorStop(0.82, accentHex);
  goldGrad.addColorStop(1,    accentDark);

  ctx.beginPath();
  ctx.arc(CX, CY, OUTER_R, 0, PI2, false);
  ctx.moveTo(CX + SEG_R, CY);
  ctx.arc(CX, CY, SEG_R, 0, PI2, true);
  ctx.fillStyle = goldGrad;
  ctx.fill('evenodd');

  // Pointillés décoratifs sur l'anneau
  const dotCount = 48;
  for (let i = 0; i < dotCount; i++) {
    const a  = (i / dotCount) * PI2;
    const dr = OUTER_R - RING_W / 2;
    ctx.beginPath();
    ctx.arc(CX + dr * Math.cos(a), CY + dr * Math.sin(a), 2.5, 0, PI2);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.6)' : 'rgba(80,50,0,0.5)';
    ctx.fill();
  }

  // Bordures fines anneau
  [OUTER_R, SEG_R].forEach(r => {
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, PI2);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
  });

  // ── 4. Centre (fixe) ──────────────────────────────────────────────────────────
  const hubGrad = ctx.createRadialGradient(CX - 11, CY - 11, 3, CX, CY, CENTER_R);
  hubGrad.addColorStop(0,   '#FFFFFF');
  hubGrad.addColorStop(0.55,'#E2E8F0');
  hubGrad.addColorStop(1,   '#94A3B8');

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur  = 12;
  ctx.beginPath();
  ctx.arc(CX, CY, CENTER_R, 0, PI2);
  ctx.fillStyle = hubGrad;
  ctx.fill();
  ctx.restore();

  // Anneau doré du centre
  ctx.beginPath();
  ctx.arc(CX, CY, CENTER_R, 0, PI2);
  ctx.strokeStyle = '#B8860B';
  ctx.lineWidth   = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, CENTER_R - 7, 0, PI2);
  ctx.strokeStyle = 'rgba(255,215,0,0.5)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();
}

// ─── Easing ──────────────────────────────────────────────────────────────────
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

// ─── Spin principal ───────────────────────────────────────────────────────────
async function doSpin() {
  if (spinning) return;
  spinning = true;

  const btn = document.getElementById('btn-spin');
  btn.disabled    = true;
  btn.textContent = tr('client.wheel.spinning');

  // Appel API
  let result;
  try {
    const res = await fetch('/api/spin', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ ...formData, restaurant_id: RESTAURANT_ID }),
    });
    result = await res.json();
    if (!res.ok) {
      if (result.code === 'already_spun') {
        throw new Error(tr('client.err.already', { hours: result.cooldown_hours || 24 }));
      }
      if (result.code === 'already_spun_phone') {
        throw new Error(tr('client.err.already.phone', { hours: result.cooldown_hours || 24 }));
      }
      throw new Error(result.error || tr('client.err.generic'));
    }
    // Soft lock navigateur (complément anti-abus)
    try {
      const key = `rw_spin_${RESTAURANT_ID}_${(formData.email || '').toLowerCase()}`;
      localStorage.setItem(key, String(Date.now()));
    } catch (_) {}
  } catch (err) {
    alert(err.message);
    spinning = false;
    btn.disabled    = false;
    btn.textContent = tr('client.wheel.spin');
    return;
  }

  btn.textContent = tr('client.wheel.spin');

  const wonPrize = result.prize;
  const segAngle = PI2 / slots.length;

  // Indices des slots correspondant au lot gagné
  const matchIdx = slots
    .map((s, i) => i)
    .filter(i => slots[i].id === wonPrize.id);

  // Slot cible choisi aléatoirement parmi les slots du lot gagné
  const targetIdx = matchIdx[Math.floor(Math.random() * matchIdx.length)];

  // Angle idéal : segment cible sous le pointeur (haut = -π/2)
  const slotCenter = targetIdx * segAngle + segAngle / 2;
  const idealNorm  = ((-Math.PI / 2 - slotCenter) % PI2 + PI2) % PI2;
  const curNorm    = (angle % PI2 + PI2) % PI2;
  let diff = idealNorm - curNorm;
  if (diff <= 0) diff += PI2;

  // Tours complets (6-9 tours) pour l'effet casino
  const extraTurns  = (6 + Math.floor(Math.random() * 4)) * PI2;
  const targetAngle = angle + diff + extraTurns;
  const startAngle  = angle;
  const duration    = 4500;
  const startTime   = performance.now();

  function spinFrame(now) {
    const t     = Math.min((now - startTime) / duration, 1);
    angle       = startAngle + (targetAngle - startAngle) * easeOutQuart(t);
    drawWheel(angle);
    if (t < 1) {
      requestAnimationFrame(spinFrame);
    } else {
      if (wonPrize.is_real_prize) {
        flashSegment(targetIdx, 5, () => showResult(result));
      } else {
        showResult(result);
      }
    }
  }
  requestAnimationFrame(spinFrame);
}

// ─── Flash du segment gagnant ─────────────────────────────────────────────────
function flashSegment(idx, times, callback) {
  let tick = 0;
  const frozenAngle = angle;
  function step() {
    drawWheel(frozenAngle, tick % 2 === 0 ? idx : -1);
    tick++;
    if (tick < times * 2) {
      setTimeout(() => requestAnimationFrame(step), 140);
    } else {
      drawWheel(frozenAngle);
      setTimeout(callback, 220);
    }
  }
  requestAnimationFrame(step);
}

// ─── Affichage résultat ───────────────────────────────────────────────────────
let currentSpinId = null;
let lastResult = null;
let resultFxDone = false;

function paintResult(data) {
  const { prize, customer } = data;
  document.getElementById('result-name').textContent =
    tr('client.result.hello', { name: `${customer.first_name} ${customer.last_name}` });

  if (prize.is_real_prize) {
    document.getElementById('result-icon').textContent = '★';
    document.getElementById('result-card').classList.add('won');
    document.getElementById('result-prize').classList.remove('no-win');
    document.getElementById('result-prize').textContent = prize.name;
    document.getElementById('result-desc').textContent  =
      prize.description || tr('client.result.congrats');

    document.getElementById('result-next-visit').style.display = 'block';
    if (prize.deadline) {
      const d = new Date(prize.deadline);
      document.getElementById('deadline-text').textContent =
        tr('client.result.until', { date: d.toLocaleDateString(loc(), { day:'numeric', month:'long', year:'numeric' }) });
      document.getElementById('result-deadline').style.display = 'inline-flex';
    }
    document.getElementById('reminder-opt').style.display = 'flex';
  } else {
    document.getElementById('result-icon').textContent = '—';
    document.getElementById('result-prize').classList.add('no-win');
    document.getElementById('result-prize').textContent = tr('client.result.lose');
    document.getElementById('result-desc').textContent  = tr('client.result.lose.desc');
    document.getElementById('reminder-opt').style.display = 'none';
  }
}

function showResult(data) {
  document.getElementById('wheel-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'flex';

  lastResult = data;
  currentSpinId = data.spin_id;
  paintResult(data);

  if (data.prize.is_real_prize && !resultFxDone) {
    resultFxDone = true;
    document.getElementById('reminder-check').checked = true;
    document.getElementById('reminder-confirm').style.display = 'none';
    toggleReminder(document.getElementById('reminder-check'));
    launchSparkles();
  }
  spinning = false;
}

async function toggleReminder(checkbox) {
  if (!currentSpinId) return;
  await fetch(`/api/spin/${currentSpinId}/reminders`, {
    method:  'PUT',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ allow: checkbox.checked }),
  });
  const confirm = document.getElementById('reminder-confirm');
  if (checkbox.checked) {
    confirm.textContent = tr('client.sms.on');
    confirm.style.display = 'block';
  } else {
    confirm.textContent = tr('client.sms.off');
    confirm.style.display = 'block';
    setTimeout(() => { confirm.style.display = 'none'; }, 2000);
  }
}

// ─── Étincelles de victoire ───────────────────────────────────────────────────
function launchSparkles() {
  const wrap   = document.getElementById('sparkles');
  const colors = ['#ffd60a','#ff2d6a','#00c2ff','#00e5c8','#fff8e7','#ff1744'];
  for (let i = 0; i < 130; i++) {
    const el    = document.createElement('div');
    const size  = 5 + Math.random() * 11;
    const dur   = 1.5 + Math.random() * 2;
    const delay = Math.random() * 1;
    el.className = 'spark';
    el.style.cssText = `
      width:${size}px;height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      left:${Math.random()*100}%;top:-${size}px;
      animation-duration:${dur}s;animation-delay:${delay}s;
    `;
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 5000);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
if (!RESTAURANT_ID) {
  // Lien sans ?r= — le message d'erreur est déjà affiché
} else {
applyTheme();

document.addEventListener('rw:lang', () => {
  if (slots.length) {
    slots.forEach(s => { s.shortLabel = shortLabel(s.name); });
    const wheel = document.getElementById('wheel-section');
    if (wheel && wheel.style.display === 'flex') drawWheel(angle);
  }
  const spinBtn = document.getElementById('btn-spin');
  if (spinBtn) spinBtn.textContent = spinning ? tr('client.wheel.spinning') : tr('client.wheel.spin');
  const nextBtn = document.getElementById('btn-next');
  if (nextBtn && document.getElementById('form-section').style.display !== 'none') {
    if (!nextBtn.disabled) nextBtn.textContent = tr('client.next');
    else nextBtn.textContent = tr('client.loading');
  }
  if (lastResult) paintResult(lastResult);
  const confirm = document.getElementById('reminder-confirm');
  const check = document.getElementById('reminder-check');
  if (confirm && confirm.style.display === 'block' && check) {
    confirm.textContent = check.checked ? tr('client.sms.on') : tr('client.sms.off');
  }
});

// ─── Formulaire ───────────────────────────────────────────────────────────────
document.getElementById('btn-next').addEventListener('click', async () => {
  const fn  = document.getElementById('first_name').value.trim();
  const ln  = document.getElementById('last_name').value.trim();
  const em  = document.getElementById('email').value.trim();
  const ph  = document.getElementById('phone').value.trim();
  const err = document.getElementById('form-err');

  const phoneOk = /^(\+33|0)[1-9]([\s.\-]?\d{2}){4}$/.test(ph.replace(/\s/g, ' ').trim())
    || /^(\+33|0)[1-9]\d{8}$/.test(ph.replace(/[\s.\-]/g, ''));

  if (!fn || !ln || !em || !/\S+@\S+\.\S+/.test(em) || !phoneOk) {
    err.textContent = !phoneOk ? tr('client.err.phone') : tr('client.err.fields');
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  formData = { first_name: fn, last_name: ln, email: em, phone: ph };

  // Soft check navigateur
  try {
    const key = `rw_spin_${RESTAURANT_ID}_${em.toLowerCase()}`;
    const last = parseInt(localStorage.getItem(key) || '0', 10);
    const hours = 24;
    if (last && Date.now() - last < hours * 3600 * 1000) {
      err.textContent = tr('client.err.cooldown', { hours });
      err.style.display = 'block';
      return;
    }
  } catch (_) {}

  const btn = document.getElementById('btn-next');
  btn.disabled    = true;
  btn.textContent = tr('client.loading');

  await loadPrizes();

  document.getElementById('form-section').style.display = 'none';
  const ws = document.getElementById('wheel-section');
  ws.style.display = 'flex';
  drawWheel(0);
});

document.getElementById('btn-spin').addEventListener('click', doSpin);
}
</script>
